server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: emotion-agent-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:emotion_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt:
    secret: ${JWT_SECRET:EmotionAgentGradProjectSecretKey2026ForJWTSigningMinimum32Bytes!}
    expiration-hours: ${JWT_EXPIRATION_HOURS:72}
  llm:
    provider: ${LLM_PROVIDER:deepseek}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    api-key: ${DEEPSEEK_API_KEY:}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
    max-retries: ${LLM_MAX_RETRIES:1}
    temperature: ${LLM_TEMPERATURE:0.5}
    max-tokens: ${LLM_MAX_TOKENS:600}
    prompt-version: v1.0
  nlp:
    default-method: ${NLP_DEFAULT_METHOD:RULE_V1}
    external-service-url: ${NLP_SERVICE_URL:http://127.0.0.1:8001}
    external-enabled: ${NLP_EXTERNAL_ENABLED:false}
  agent:
    max-history-items: 5
    max-history-chars: 1200
    rate-limit-per-minute: 100
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

logging:
  level:
    com.emotionagent: INFO
